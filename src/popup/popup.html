<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vaultwarden</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header id="status" class="status"></header>
    <nav id="settings" class="settings" hidden></nav>
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="Search vault" autocomplete="off" />
      <button id="new-item" class="new-item" type="button" title="New entry" hidden>+</button>
    </div>
    <p id="error" class="banner" role="alert" hidden></p>
    <main id="root"></main>
    <script src="popup.js"></script>
  </body>
</html>
